name: Generate RSS and Sitemap

on:
  push:
    branches:
      - main  
    paths:
      - 'blog/**'
      - 'index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- ШАГ 1: ГЕНЕРАЦИЯ RSS НА PYTHON ---
      # Скрипт находит файлы, безопасно вытаскивает теги и экранирует спецсимволы
      - name: Run RSS Generator
        run: |
          python -c "
          import os, re
          from datetime import datetime

          site_url = 'https://vacuumlab.ru'
          blog_dir = os.path.join(os.getcwd(), 'blog')
          items_xml = []

          if os.path.exists(blog_dir):
              for folder in os.listdir(blog_dir):
                  file_path = os.path.join(blog_dir, folder, 'index.html')
                  if os.path.exists(file_path):
                      with open(file_path, 'r', encoding='utf-8') as f:
                          html = f.read()
                      
                      title_m = re.search(r'<title>([^<]+)</title>', html)
                      desc_m = re.search(r'<meta name=\"description\" content=\"([^\"]+)\"', html)
                      date_m = re.search(r'datetime=\"([^\"]+)\"', html)
                      
                      if title_m:
                          title = title_m.group(1).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                          desc = desc_m.group(1).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') if desc_m else ''
                          post_url = f'{site_url}/blog/{folder}/'
                          
                          pub_date = ''
                          if date_m:
                              try:
                                  dt = datetime.strptime(date_m.group(1), '%Y-%m-%d')
                                  pub_date = f'<pubDate>{dt.strftime(\"%a, %d %b %Y %H:%M:%S GMT\")}</pubDate>'
                              except:
                                  pass
                          
                          item = f'<item><title>{title}</title><link>{post_url}</link><description>{desc}</description><guid>{post_url}</guid>{pub_date}</item>'
                          items_xml.append(item)

          xml_content = f'<?xml version=\"1.0\" encoding=\"UTF-8\" ?><rss version=\"2.0\" xmlns:atom=\"http://w3.org\"><channel><title>Лабораторный журнал — VacuumLab</title><link>{site_url}/blog/</link><description>Коротко о новых статьях и лабораторный журнал проекта</description><atom:link href=\"{site_url}/rss.xml\" rel=\"self\" type=\"application/rss+xml\" />' + '\n'.join(items_xml) + '</channel></rss>'
          
          with open('rss.xml', 'w', encoding='utf-8') as f:
              f.write(xml_content)
          print('RSS успешно сгенерирован!')
          "

      # --- ШАГ 2: ГЕНЕРАЦИЯ SITEMAP.XML ---
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://vacuumlab.ru
          include-pdf: false

      # --- ШАГ 3: ПУШ ФАЙЛОВ НА САЙТ ---
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add rss.xml sitemap.xml
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-generated RSS and Sitemap"
          git push
