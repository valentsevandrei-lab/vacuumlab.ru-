name: Generate RSS and Sitemap

on:
  push:
    branches:
      - main  
    paths:
      - 'blog/**'
      - 'index.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- ШАГ 1: БЕЗОПАСНОЕ СОЗДАНИЕ СКРИПТА ---
      # Полностью экранируем спецсимволы XML, беря только строковые группы [1]
      - name: Create RSS Script File
        run: |
          echo "const fs = require('fs');" >> script.js
          echo "const path = require('path');" >> script.js
          echo "const SITE_URL = 'https://vacuumlab.ru';" >> script.js
          echo "const BLOG_DIR = path.join(process.cwd(), 'blog');" >> script.js
          echo "if (!fs.existsSync(BLOG_DIR)) process.exit(0);" >> script.js
          echo "const files = fs.readdirSync(BLOG_DIR);" >> script.js
          echo "let items = '';" >> script.js
          echo "files.forEach(f => {" >> script.js
          echo "  const p = path.join(BLOG_DIR, f, 'index.html');" >> script.js
          echo "  if (fs.existsSync(p)) {" >> script.js
          echo "    const html = fs.readFileSync(p, 'utf8');" >> script.js
          echo "    const tMatch = html.match(/<title>([^<]+)<\/title>/);" >> script.js
          echo "    const dMatch = html.match(/<meta name=\"description\" content=\"([^\"]+)\"/);" >> script.js
          echo "    const dateMatch = html.match(/datetime=\"([^\"]+)\"/);" >> script.js
          echo "    if (tMatch && tMatch[1]) {" >> script.js
          echo "      const title = tMatch[1].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');" >> script.js
          echo "      const desc = (dMatch && dMatch[1]) ? dMatch[1].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';" >> script.js
          echo "      const url = SITE_URL + '/blog/' + f + '/';" >> script.js
          echo "      let pDate = '';" >> script.js
          echo "      if (dateMatch && dateMatch[1]) {" >> script.js
          echo "        const d = new Date(dateMatch[1]);" >> script.js
          echo "        if (!isNaN(d.getTime())) pDate = '<pubDate>' + d.toUTCString() + '</pubDate>';" >> script.js
          echo "      }" >> script.js
          echo "      items += '<item><title>' + title + '</title><link>' + url + '</link><description>' + desc + '</description><guid>' + url + '</guid>' + pDate + '</item>\n';" >> script.js
          echo "    }" >> script.js
          echo "  }" >> script.js
          echo "});" >> script.js
          echo "const xml = '<?xml version=\"1.0\" encoding=\"UTF-8\"?><rss version=\"2.0\"><channel><title>Лабораторный журнал — VacuumLab</title><link>' + SITE_URL + '/blog/</link><description>Коротко о новых статьях</description>' + items + '</channel></rss>';" >> script.js
          echo "fs.writeFileSync('rss.xml', xml);" >> script.js

      # --- ШАГ 2: ВЫПОЛНЕНИЕ СКРИПТА ---
      - name: Run RSS Generator
        run: node script.js

      # --- ШАГ 3: ГЕНЕРАЦИЯ КАРТЫ САЙТА ---
      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://vacuumlab.ru
          include-pdf: false

      # --- ШАГ 4: ПУШ ФАЙЛОВ НА САЙТ ---
      - name: Commit and Push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add rss.xml sitemap.xml
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-generated RSS and Sitemap"
          git push
